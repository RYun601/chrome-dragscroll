<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>滚动截图 · 设置</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 540px; margin: 28px auto; padding: 0 16px; color: #1f2430; }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .sub { font-size: 12px; color: #6b7280; margin-bottom: 16px; }
  .field { margin: 14px 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .field label { flex: 1; }
  .help { font-size: 12px; color: #6b7280; margin-top: 2px; }
  input[type=number], input[type=text] { width: 130px; padding: 6px 8px; border: 1px solid #ccd3e0; border-radius: 8px; font-size: 13px; }
  select { padding: 6px 8px; border: 1px solid #ccd3e0; border-radius: 8px; font-size: 13px; }
  button { padding: 8px 20px; background: #3d7bff; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; }
  button:hover { background: #2f67e6; }
  #status { color: #16a34a; font-size: 13px; margin-left: 12px; }
</style>
</head>
<body>
  <h1>滚动截图 · 设置</h1>
  <div class="sub">设置保存在本机浏览器，改动即时生效。</div>

  <div class="field">
    <label>边缘触发距离 (px)<div class="help">光标靠近滚动区域边缘多少像素内开始自动滚动</div></label>
    <input type="number" id="edgeMargin" min="8" max="200" />
  </div>

  <div class="field">
    <label>滚动速度 (px/秒)<div class="help">光标贴边时的滚动速度</div></label>
    <input type="number" id="scrollSpeed" min="100" max="5000" step="50" />
  </div>

  <div class="field">
    <label>滚动稳定等待 (ms)<div class="help">每次滚动后等待页面稳定再截图；懒加载/图片多的页面可调大</div></label>
    <input type="number" id="settleDelay" min="0" max="2000" step="10" />
  </div>

  <div class="field">
    <label>截图时隐藏固定/悬浮元素<div class="help">避免页头/悬浮按钮在长图中重复出现</div></label>
    <input type="checkbox" id="hideFixed" />
  </div>

  <div class="field">
    <label>输出方式<div class="help">截图完成后在结果面板手动选择「保存 PNG / 复制 / 关闭」，不会自动保存或弹窗</div></label>
  </div>

  <div class="field">
    <label>文件名前缀</label>
    <input type="text" id="filenamePrefix" placeholder="screenshot" />
  </div>

  <button id="save">保存设置</button><span id="status"></span>

  <script src="options.js"></script>
</body>
</html>
